name: OneBlock 2.3.0 Transfer

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Recover verified JAR
        shell: bash
        run: |
          curl -fsSL --retry 3 https://paste.rs/zbC8f -o oneblock-2.3.0.jar.b64
          base64 --decode oneblock-2.3.0.jar.b64 > oneblock-2.3.0.jar

      - name: Verify JAR
        shell: bash
        run: |
          test "$(stat -c%s oneblock-2.3.0.jar)" = '32992'
          echo '51bc49fc76fdef93858d24578bf7fbf1a6056b4d2343d94c1d1468bcce82399f  oneblock-2.3.0.jar' | sha256sum --check
          jar tf oneblock-2.3.0.jar | grep -E 'fabric.mod.json|dev/kurude/oneblock/OneBlockMod.class|data/oneblock/worldgen/world_preset/oneblock.json'

      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: oneblock-2.3.0-jar
          path: oneblock-2.3.0.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
